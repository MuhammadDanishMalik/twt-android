# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. For more details, visit
# https://developer.android.com/r/tools/gradle-multi-project-decoupled-projects
# org.gradle.parallel=true
# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official
# KSP (Hilt's annotation processor) registers its generated sources through the
# `kotlin.sourceSets` DSL, which AGP 9's built-in Kotlin support rejects by
# default. This is the escape hatch AGP itself points at in that error message.
# Remove it once KSP registers generated sources via `android.sourceSets`.
android.disallowKotlinSourceSets=false

# The twt-admin base URL that sends six-digit email codes through Resend, for
# debug builds (release always uses tradewithtanha.io).
#   Deployed (default): https://tradewithtanha.io — codes really arrive
#   Local, emulator:    http://10.0.2.2:3001   (npm run dev -- -p 3001 in twt-admin)
#   Local, phone:       http://<this Mac's LAN IP>:3001  (npm run dev -- -H 0.0.0.0 -p 3001)
# A local URL only works while that dev server is running; otherwise every
# "Resend code" fails. Blank means no codes: Firebase's verification link.
adminApiBase=https://tradewithtanha.io
